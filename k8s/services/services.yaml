apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: default
spec:
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: discovery-server
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: default
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: default
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: user-service
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: default
spec:
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: chat-service
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: message-store-service
  namespace: default
spec:
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: message-store-service
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: default
spec:
  ports:
    - port: 8084
      targetPort: 8084
  selector:
    app: notification-service
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: audit-log-service
  namespace: default
spec:
  ports:
